name: Something broke
description: Locant did the wrong thing, or nothing at all
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you pointed at, and what Locant gave you.
      placeholder: |
        I pointed at the Send button in Mail. The overlay named the whole toolbar instead of the button.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Which app were you pointing at
      placeholder: Mail, Figma, Chrome, the iOS Simulator
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings › General › Copy Diagnostics, then paste. It carries the Locant version, macOS, chip, displays, permissions, and settings, with your user name replaced by ~. Before 0.9, write the version (menu bar icon, then Settings) and your macOS version and chip here.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: payload
    attributes:
      label: The payload, if you still have it
      description: Paste what Locant copied. Take out anything private first.
      render: markdown
