# specs/v0.9.md R67: the same build and tests a contributor runs, on every push to main and every
# pull request. No signing, no secrets, no release: releases are built on a Mac that holds the
# Developer ID and the notary profile (scripts/release.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build and test
        run: |
          mkdir -p build
          xcodebuild -project Locant.xcodeproj -scheme Locant -destination 'platform=macOS' test \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            -derivedDataPath build/DerivedData-ci -quiet 2>&1 | tee build/xcodebuild.log
      - name: Test summary
        if: always()
        run: grep -E "Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)" build/xcodebuild.log | tail -2

  files:
    name: Schema and skill
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The capture schema is valid JSON
        run: python3 -m json.tool schema/capture.schema.json > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The sidecar fixtures match the capture schema
        # LocantTests/Fixtures/sidecar-*.json are captures as the app writes them, one with only the keys
        # the schema requires. The schema is the only interface (docs/CLAUDE.md), so a fixture it rejects
        # is a drift in one or the other; the same fixtures are decoded by LocantTests/MCPServerTests.swift.
        run: |
          python3 -m pip install --quiet jsonschema rfc3339-validator
          python3 - <<'EOF'
          import glob, json, sys
          from jsonschema import Draft202012Validator
          schema = json.load(open("schema/capture.schema.json"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=Draft202012Validator.FORMAT_CHECKER)
          files = sorted(glob.glob("LocantTests/Fixtures/sidecar-*.json"))
          assert files, "no sidecar fixtures under LocantTests/Fixtures"
          failed = 0
          for path in files:
              errors = sorted(validator.iter_errors(json.load(open(path))), key=lambda e: e.json_path)
              for e in errors:
                  print(f"{path}: {e.json_path}: {e.message}")
              failed += bool(errors)
              print(("FAIL  " if errors else "ok    ") + path)
          sys.exit(1 if failed else 0)
          EOF
      - name: The Locant skill's frontmatter
        # The static half of scripts/check-skill.sh; the skill's own command needs the app.
        run: |
          skill=plugins/locant/skills/locant/SKILL.md
          test "$(sed -n 1p $skill)" = "---"
          name=$(awk 'NR > 1 && /^---$/ { exit } NR > 1 && sub(/^name: /, "") { print }' $skill)
          test "$name" = locant
          awk 'NR > 1 && /^---$/ { exit } /^description: ./ { found = 1 } END { exit !found }' $skill
      - name: The plugin manifests are valid JSON
        run: |
          python3 -m json.tool plugins/locant/.cursor-plugin/plugin.json > /dev/null
          python3 -m json.tool .cursor-plugin/marketplace.json > /dev/null
